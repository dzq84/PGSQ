[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmel-codec"
version = "0.2.0"
description = "Independent grouped-FSQ spectral speech codec experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "einops>=0.8,<0.9",
  "huggingface-hub>=0.26,<1",
  "hydra-core==1.3.2",
  "librosa>=0.10.2,<0.12",
  "lightning>=2.3,<2.6",
  "lhotse>=1.29,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2.1",
  "omegaconf==2.3.0",
  "rich>=13.9,<15",
  "scipy>=1.14,<2",
  "setuptools>=68,<81",
  "soundfile>=0.12,<0.14",
  "torch>=2.5,<2.7",
  "torchaudio>=2.5,<2.7",
  "vector-quantize-pytorch>=1.20.9,<2",
]

[project.optional-dependencies]
train = [
  "tensorboard>=2.17,<3",
]
tracking = [
  "wandb>=0.18,<1",
]
eval = [
  "jiwer==3.1.0",
  "pesq==0.0.4",
  "pystoi==0.4.1",
  "scikit-learn==1.7.2",
  "speechbrain==1.1.0",
  "torchmetrics>=1.4,<2",
  "transformers==4.48.0",
]
dac = [
  "descript-audio-codec==1.0.0",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dmel_codec*"]
namespaces = true

[tool.setuptools.package-data]
dmel_codec = [
  "config/**/*.yaml",
  "config/**/*.json",
  "models/modules/bigvgan/**/*.cpp",
  "models/modules/bigvgan/**/*.cu",
  "models/modules/bigvgan/**/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
]
