# @package _global_

defaults:
  - refinement_base
  - _self_

experiment:
  name: refinement_waveform_joint_vocoder_tail_gan
  trainer:
    max_steps: 3000
    val_check_interval: 500

data:
  module:
    train_max_durations: 3.0

codec:
  system_name: Ours-M decoder refinement (joint vocoder tail + waveform GAN)
  model:
    refinement_mode: waveform_joint_vocoder_tail_gan
    waveform_loss_weight: 0.1
    waveform_discriminator:
      _target_: dmel_codec.models.modules.waveform_discriminator.WaveformDiscriminator
      periods: [2, 3, 5, 7, 11]
      resolutions:
        - [1024, 120, 600]
        - [2048, 240, 1200]
        - [512, 50, 240]
      channel_multiplier: 1.0
      use_spectral_norm: false
    discriminator_lr_scale: 10.0
    gan_adversarial_weight: 0.1
    gan_feature_weight: 10.0
    gradient_clip_val: 500.0
