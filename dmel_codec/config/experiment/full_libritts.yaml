# @package _global_

experiment:
  name: full_libritts
  require_vocoder: true
  run_dir: ${oc.env:DMEL_RUN_ROOT,./runs}/full_libritts/${codec.name}/seed_${seed}
  trainer:
    _target_: lightning.pytorch.Trainer
    accelerator: gpu
    devices: 1
    precision: 32-true
    max_steps: 100000
    max_epochs: 1000
    val_check_interval: 1000
    log_every_n_steps: 20
    strategy: auto
  callbacks:
    checkpoint:
      _target_: dmel_codec.utils.callbacks.FinalizedModelCheckpoint
      dirpath: ${experiment.run_dir}/checkpoints
      filename: "step-{step:08d}"
      auto_insert_metric_name: false
      monitor: val_loss
      mode: min
      every_n_epochs: 1
      save_on_train_epoch_end: false
      save_top_k: 2
      save_last: true
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${experiment.run_dir}/logs
    name: tensorboard
    log_graph: false

data:
  module:
    train_max_durations: 60.0
    val_max_durations: 30.0

codec:
  model:
    optimizer:
      lr: 0.0001
    lr_scheduler:
      lr_lambda:
        num_training_steps: ${experiment.trainer.max_steps}
        final_lr_ratio: 0.1
